# 12FactorApp: committed working dev defaults; env overrides.
spring.datasource.url=${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_collections?sslmode=disable}
spring.datasource.username=${DCRE_DB_USER:root}
spring.datasource.password=${DCRE_DB_PASSWORD:}

# Per-service prefixed Batch metadata (R-34/A-39b: Liquibase-owned DDL copy,
# EXIT_MESSAGE widened; single writer via the CIR_BATCH_ prefix).
spring.batch.jdbc.table-prefix=CIR_BATCH_
spring.batch.jdbc.initialize-schema=never
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

dcre.exchange-root=${DCRE_EXCHANGE_ROOT:../../infra/dcre-infra/exchange}
dcre.amount-scale=${DCRE_AMOUNT_SCALE:2}
dcre.v1-enabled=${DCRE_V1_ENABLED:false}
